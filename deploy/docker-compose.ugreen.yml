services:
  workbase:
    image: ghcr.io/hermansusandy/workbase:latest
    container_name: workbase
    pull_policy: always
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Replace CHANGE_DATABASE_PASSWORD before deployment. URL-encode special
      # characters such as @, :, /, #, and % in the password.
      DATABASE_URL: "postgresql://Admin:CHANGE_DATABASE_PASSWORD@postgres_db:5432/webnote"
    ports:
      - "3000:3000"
    networks:
      - database_network
    restart: always

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: workbase-cloudflared
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - CHANGE_CLOUDFLARE_TUNNEL_TOKEN
    networks:
      - database_network
    depends_on:
      - workbase
    restart: always

networks:
  database_network:
    external: true
    name: database_network
