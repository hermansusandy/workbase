services:
  workbase:
    image: node:22-alpine
    container_name: workbase
    user: root
    working_dir: /app
    volumes:
      - ${WORKBASE_APP_PATH:-/volume1/docker/workbase}:/app
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
    command: ["sh", "/app/run_app.sh"]
    ports:
      - ${WORKBASE_PORT:-3000}:3000
    networks:
      - database_network
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1:3000
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: always

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-tunnel
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - database_network
    depends_on:
      workbase:
        condition: service_healthy
    restart: always

networks:
  database_network:
    external: true
    name: database_network
